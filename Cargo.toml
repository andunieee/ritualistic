[package]
name = "ritualistic"
version = "0.2.3"
edition = "2024"
rust-version = "1.91"
license = "MIT"
authors = ["andunië", "andunie@cassis.cash"]
description = "simple nostr library"
repository = "https://github.com/andunieee/ritualistic"
keywords = ["nostr"]

[features]
default = ["lmdb", "redb"]
# persistent event databases. lmdb is not available on wasm, redb is, backed by the opfs
lmdb = ["dep:lmdb-master-sys"]
redb = ["dep:redb"]

[dependencies]
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
secp256k1 = { version = "0.33.1", features = ["rand", "global-context"] }
sha2 = "0.10"
url = "2.4"
thiserror = "1.0"
unicode-normalization = "0.1"
dashmap = "6.1"
futures = "0.3"
bech32 = "0.11.0"
regex = "1.11.1"
bytes = "1.10.1"
lowercase-hex = "0.1.0"
slotmap = "1"
glidesort = "0.1.2"
base64 = "0.22.1"
chacha20 = "^0.9"
hmac = "0.12.1"
scrypt = "0.11.0"
chacha20poly1305 = "0.10"
itertools = "0.14.0"
rkyv = { version = "0.8.11", features = ["unaligned"] }
foldhash = "0.1.5"
log = "0.4"
tokio_with_wasm = { version = "0.8.7", features = ["rt", "sync", "time", "macros"] }
redb = { version = "4.3.0", optional = true }

[target.'cfg(target_arch = "wasm32")'.dependencies]
web-sys = { version = "0.3", features = [
  "console", "BinaryType", "Blob", "CloseEvent", "ErrorEvent", "MessageEvent", "DomException", "WebSocket",
  # the opfs backend for redb
  "File", "StorageManager", "FileSystemDirectoryHandle", "FileSystemFileHandle", "FileSystemGetFileOptions",
  "FileSystemWritableFileStream", "FileSystemCreateWritableOptions", "WriteParams", "WriteCommandType",
] }
wasm-bindgen = "0.2"
wasm-bindgen-futures = "0.4"
js-sys = "0.3"
old_getrandom = { package = "getrandom", version = "^0.2", features = ["js"] }
getrandom = { version = "^0.3", features = ["wasm_js"] }

[target.'cfg(not(target_arch = "wasm32"))'.dependencies]
tokio = { version = "1.0", features = ["rt", "sync", "time", "macros"] }
hyper = { version = "1.6.0", features = ["full"] }
hyper-tungstenite = "0.18.0"
tokio-tungstenite = { version = "0.27.0", features = ["rustls-tls-native-roots"] }
reqwest = { version = "0.12.20", default-features = false, features = ["json", "rustls-tls"] }
http-body-util = "0.1.3"
hyper-util = { version = "0.1.14", features = ["tokio"] }
lmdb-master-sys = { version = "0.2.5", optional = true }

# sha2's "asm" feature pulls in sha2-asm, which does not support Windows
# targets, so only enable it where it builds. elsewhere the pure-Rust
# backend from the main `sha2` dependency above is used.
[target.'cfg(all(not(target_arch = "wasm32"), not(target_os = "windows")))'.dependencies]
sha2 = { version = "0.10", features = ["asm"] }

[dev-dependencies]
assertables = "9.8.2"
criterion = { version = "0.7", default-features = false }
tempfile = "3"

[[bench]]
name = "helpers"
harness = false

[target.'cfg(target_arch = "wasm32")'.dev-dependencies]
wasm-bindgen-test = "0.3.50"
